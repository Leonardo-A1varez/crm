# Pre-commit + commit-msg + pre-push hooks (lefthook).
# Install: `npm install` runs `prepare` script → `lefthook install`.
# Override (emergencia): `git commit --no-verify` (auditado — no usar de rutina).
# Docs: https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  jobs:
    - name: typecheck
      run: npm run typecheck
      tags: quality
    - name: lint-staged
      run: npx lint-staged
      tags: quality
      stage_fixed: true
    - name: tests-related
      run: npx vitest related {staged_files} --run --reporter=dot --passWithNoTests
      glob: "{src,tests}/**/*.{ts,tsx}"
      tags: quality

commit-msg:
  jobs:
    - name: commitlint
      run: npx --no-install commitlint --edit {1}
      tags: quality

pre-push:
  jobs:
    - name: full-test
      # Con todos los núcleos la máquina se satura y tests de pantalla pasan los
      # 5 s al azar (2026-10-11: un archivo distinto en cada push). Mitad de núcleos.
      run: npm test -- --maxWorkers=50%
      tags: quality
